<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
       



        <h1>Student Registration Management</h1>
        <p>Manage student registrations easily</p>

        <!-- Dashboard -->
        <div class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>

            <div class="card">
                <h3>Total Seats</h3>
                <h2>100</h2>
            </div>

            <div class="card">
                <h3>Available Seats</h3>
                <h2 id="availableSeats">100</h2>
            </div>

        </div>

        <!-- Student Registration Form -->
        <div class="section">

            <h2>Register New Student</h2>

            <form id="studentForm">

                <input type="text" id="name" placeholder="Student Name" required>

                <input type="number" id="age" placeholder="Age" min="1" max="100" required>

                
    <div class="gender">
    Gender :
    <input type="radio" id="male" name="gender" value="Male" required> Male
    <input type="radio" id="female" name="gender" value="Female"> Female
    <input type="radio" id="other" name="gender" value="Other"> Other
</div>

                <input type="text" id="phone" placeholder="Phone Number" max="10" required>

                <input type="email" id="email" placeholder="Email Address" required>

                
                <button type="submit" id="submitButton">Register Student</button>

                <button type="button" onclick="clearForm()">Clear Form</button>

                <button type="button" id="cancelButton" onclick="cancelEdit()" style="display: none;">
                 Cancel Edit
                 </button>

            </form>

        </div>

        <!-- Student List -->
        <div class="section">

            <h2>Student Records</h2>

            <input type="text" id="search" placeholder="Search student...">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Registration Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
